<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Yogiraj Agri-Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #060d08; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        
        .bg-spot-1 {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            pointer-events: none;
            animation: float 20s ease-in-out infinite;
        }
        .bg-spot-2 {
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(5, 150, 105, 0.1) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            pointer-events: none;
            animation: float 25s ease-in-out infinite reverse;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -50px) scale(1.1); }
            50% { transform: translate(-30px, 30px) scale(0.9); }
            75% { transform: translate(40px, 20px) scale(1.05); }
        }
        
        .glass-card {
            background: rgba(13, 27, 18, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(52, 211, 153, 0.12);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .input-field {
            background: rgba(2, 8, 4, 0.8);
            border: 1.5px solid rgba(52, 211, 153, 0.08);
            color: #ecfdf5;
            padding: 14px 16px 14px 48px;
            border-radius: 14px;
            width: 100%;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: rgba(52, 211, 153, 0.4);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.06);
        }
        .input-field::placeholder { color: rgba(148, 163, 184, 0.3); }
        
        .input-wrapper {
            position: relative;
        }
        .input-wrapper .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(148, 163, 184, 0.3);
            font-size: 18px;
        }
        
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(148, 163, 184, 0.3);
            cursor: pointer;
            font-size: 18px;
            transition: color 0.3s ease;
        }
        .toggle-password:hover { color: rgba(148, 163, 184, 0.6); }
        
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #060d08;
            font-weight: 700;
            padding: 16px;
            border-radius: 14px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            font-size: 11px;
            color: rgba(148, 163, 184, 0.2);
        }
        .security-badge i { font-size: 12px; }
        .security-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #10b981;
        }
        
        .brand-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            color: #060d08;
            font-weight: 800;
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.25);
        }
    </style>
</head>
<body>

    <div class="bg-spot-1"></div>
    <div class="bg-spot-2"></div>

    <div class="glass-card">
        <div class="text-center mb-8">
            <div class="brand-icon">Y</div>
            <h1 class="text-2xl font-extrabold text-white">Admin Login</h1>
            <p class="text-slate-400 text-sm mt-1">Secure Access · Yogiraj Agri-Tech</p>
        </div>

        {% if error %}
        <div class="bg-rose-500/10 border border-rose-500/20 rounded-xl p-4 mb-4">
            <p class="text-rose-400 text-sm flex items-start gap-2"><span>❌</span><span>{{ error }}</span></p>
        </div>
        {% endif %}
        
        {% if success %}
        <div class="bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-4 mb-4">
            <p class="text-emerald-400 text-sm flex items-start gap-2"><span>✅</span><span>{{ success }}</span></p>
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-6">
                <label class="text-xs text-slate-400 block mb-1.5 font-semibold uppercase tracking-wider">🔑 Password</label>
                <div class="input-wrapper">
                    <span class="icon"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required class="input-field" autofocus>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fa-regular fa-eye" id="passwordIcon"></i>
                    </button>
                </div>
                <p class="text-slate-500 text-xs mt-1">Enter the admin password</p>
            </div>
            
            <button type="submit" class="btn-primary">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
            </button>
        </form>

        <div class="security-badge">
            <i class="fa-solid fa-shield-halved"></i>
            <span>256-bit Encrypted</span>
            <span class="security-dot"></span>
            <span>Secure Session</span>
        </div>
        
        <div class="text-center mt-4">
            <a href="/" class="text-slate-500 hover:text-slate-400 text-xs transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Homepage
            </a>
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }
        
        // Auto-focus password field
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('password').focus();
        });
        
        // Enter key to submit
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                this.closest('form').submit();
            }
        });
    </script>

</body>
</html>
