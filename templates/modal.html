<!-- The Modal Overlay (Hidden by default) -->
<div id="quickViewModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black bg-opacity-60 backdrop-blur-sm transition-opacity duration-300">
    <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full mx-4 overflow-hidden transform transition-transform scale-95" id="modalContent">
        
        <!-- Modal Header -->
        <div class="flex justify-between items-center p-4 border-b border-gray-200">
            <h3 class="text-xl font-bold text-gray-800" id="modalTitle">Product Details</h3>
            <button onclick="closeModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold">&times;</button>
        </div>

        <!-- Modal Body -->
        <div class="flex flex-col md:flex-row p-6">
            <!-- Left: Image -->
            <div class="w-full md:w-1/2 mb-4 md:mb-0 flex justify-center">
                <img id="modalImage" src="" alt="Product Image" class="w-full h-64 md:h-80 object-contain rounded-lg">
            </div>
            
            <!-- Right: Details -->
            <div class="w-full md:w-1/2 md:pl-6 flex flex-col justify-between">
                <div>
                    <p class="text-gray-600 text-sm mb-2" id="modalCategory">Category</p>
                    <p class="text-gray-800 text-lg mb-4" id="modalDescription">Loading description...</p>
                    <p class="text-2xl font-bold text-purple-600 mb-4" id="modalPrice">Price: $0.00</p>
                </div>
                <div class="flex gap-3">
                    <button class="flex-1 bg-purple-600 text-white py-2 px-4 rounded-lg hover:bg-purple-700 transition">Add to Cart</button>
                    <button class="flex-1 bg-gray-200 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-300 transition">Buy Now</button>
                </div>
            </div>
        </div>
    </div>
</div>
