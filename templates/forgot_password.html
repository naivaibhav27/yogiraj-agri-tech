<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Yogiraj Agri-Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #060d08; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        .glass-card {
            background: rgba(13, 27, 18, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(52, 211, 153, 0.12);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
        }
        
        .input-field {
            background: rgba(2, 8, 4, 0.8);
            border: 1px solid rgba(52, 211, 153, 0.15);
            color: #ecfdf5;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            width: 100%;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: rgba(52, 211, 153, 0.6);
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #060d08;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.3);
        }

        .bg-spot-1 {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }
        .bg-spot-2 {
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(5, 150, 105, 0.1) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="bg-spot-1"></div>
    <div class="bg-spot-2"></div>

    <div class="glass-card">
        <div class="text-center mb-6">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 to-green-400 flex items-center justify-center text-slate-950 font-black text-2xl shadow-lg shadow-emerald-500/20 mx-auto mb-4">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">🔑 Forgot Password</h2>
            <p class="text-slate-400 text-sm mt-1">Enter your email to receive a reset link</p>
        </div>

        {% if error %}
        <div class="bg-rose-500/10 border border-rose-500/20 rounded-xl p-4 mb-4">
            <p class="text-rose-400 text-sm flex items-start gap-2">
                <span>❌</span>
                <span>{{ error }}</span>
            </p>
        </div>
        {% endif %}
        
        {% if success %}
        <div class="bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-4 mb-4">
            <p class="text-emerald-400 text-sm flex items-start gap-2">
                <span>✅</span>
                <span>{{ success }}</span>
            </p>
        </div>
        {% endif %}

        <form method="POST" action="/forgot-password">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            
            <div class="mb-4">
                <label class="text-xs text-slate-400 block mb-1.5 font-semibold uppercase tracking-wider">Email Address</label>
                <input type="email" name="email" placeholder="your@email.com" required class="input-field">
                <p class="text-slate-500 text-xs mt-1">Enter the email associated with your account</p>
            </div>
            
            <button type="submit" class="btn-primary">
                <i class="fa-solid fa-paper-plane"></i> Send Reset Link
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="/login" class="text-slate-400 hover:text-emerald-400 text-sm transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Login
            </a>
        </div>
    </div>

</body>
</html>
